name: Optimize Images

# Adapted from xanthan-web/xanthan-web.github.io at 5e106aac.
# Preserve Cascade filenames and formats; preview is the default.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder to process; . includes all tracked images, including the old Cascade folders'
        required: true
        default: '.'
      max_edge:
        description: 'Longest edge in pixels; 1600 for general images, consider 2400 for detailed flyers or maps'
        required: true
        default: '1600'
      quality:
        description: 'JPEG quality, 1–100; 85 is the default'
        required: true
        default: '85'
      apply:
        description: 'Actually change the files. Leave unticked to preview first.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

      - name: Check optimizer behavior on temporary images
        run: python3 scripts/test-optimize-images.py

      - name: Optimize or preview
        env:
          IMAGE_FOLDER: ${{ inputs.folder }}
          MAX_EDGE: ${{ inputs.max_edge }}
          JPEG_QUALITY: ${{ inputs.quality }}
          APPLY_IMAGES: ${{ inputs.apply }}
        run: |
          args=(--recursive --base-dir "$IMAGE_FOLDER" --max-edge "$MAX_EDGE" --quality "$JPEG_QUALITY"
                --report "$RUNNER_TEMP/image-optimization.json" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$APPLY_IMAGES" = true ]; then
            args+=(--apply)
          else
            args+=(--preview)
          fi
          bash scripts/optimize-images.sh "${args[@]}"

      - name: Commit smaller images
        id: commit
        if: inputs.apply
        run: |
          git config user.name 'Xanthan Image Bot'
          git config user.email 'actions@github.com'
          git add -u
          if [ -f .github/image-optimization-state.json ]; then
            git add .github/image-optimization-state.json
          fi
          if git diff --cached --quiet; then
            echo 'No smaller images to commit.'
            exit 0
          fi
          git commit -m 'Optimize images while preserving existing asset URLs'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch Pages explicitly.
      - name: Rebuild the published site
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
